<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAgro: O Equilíbrio do Futuro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌱 EcoAgro</h1>
        <h2>O Equilíbrio do Futuro</h2>

        <div class="intro">
            <p>
                Sua missão é administrar uma fazenda de forma responsável,
                equilibrando a produção agrícola com a preservação do meio ambiente.
            </p>
        </div>

        <div class="status">
            <div>
                <p>🌾 Produção</p>
                <progress id="barraProducao" value="50" max="100"></progress>
                <span id="producao">50</span>
            </div>

            <div>
                <p>🌎 Sustentabilidade</p>
                <progress id="barraSustentabilidade" value="50" max="100"></progress>
                <span id="sustentabilidade">50</span>
            </div>
        </div>

        <p><strong>Rodada:</strong> <span id="rodada">1</span>/5</p>

        <div id="cenario"></div>

        <button id="op1" onclick="escolha(0)"></button>
        <button id="op2" onclick="escolha(1)"></button>

        <div id="resultado"></div>

        <button id="reiniciar" onclick="location.reload()" style="display:none;">
            Jogar Novamente
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
